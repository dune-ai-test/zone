name: Build debug APK

on:
  push:
    branches:
      - 'android-app-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zone-android-debug-release
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Stage APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Zone-debug.apk

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-latest
          name: "Zone Android debug build #${{ github.run_number }}"
          prerelease: true
          files: android/release/Zone-debug.apk
          fail_on_unmatched_files: true
          body: |
            Automated debug APK from `${{ github.ref_name }}` at `${{ github.sha }}`.

            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Build type: debug (not a signed release build)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
